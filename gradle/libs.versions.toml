[versions]
# AndroidX versions chosen to support compileSdk 36 and AGP 9.0.1 (2026-10-31).
# Newer ones need AGP 9.1+ and compileSdk 37; moving the toolchain is a separate decision.
agp = "9.0.1"
# Pinned: LiteRT-LM 0.16.1 is built with Kotlin 2.2.21; 0.17+ needs Kotlin 2.3 (S2 note).
kotlin = "2.2.21"
litertlm = "0.16.1"
mediapipe-tasks-decision = "1.2.0"
composeBom = "2026.06.01"
coreKtx = "1.18.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
junit = "4.13.2"
coroutines = "1.9.0"
# Room 2.8.x builds with compileSdk 36 / AGP 9.0.1; room-ktx is empty since 2.7 (merged into runtime).
room = "2.8.5"
# KSP 2.3.x is versioned apart from Kotlin; 2.3.1+ is the first line that supports AGP 9 built-in
# Kotlin (2.2.21-2.0.5 refuses it). 2.3.10 fixed R-class resolution under built-in Kotlin.
ksp = "2.3.12"
robolectric = "4.17"
androidxTestCore = "1.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
litertlm-android = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litertlm" }
mediapipe-tasks-decision = { group = "com.google.mediapipe", name = "tasks-decision", version.ref = "mediapipe-tasks-decision" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
